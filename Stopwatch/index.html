<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="wrapper">
        <p>
          <span class="second">00</span>
          <span class="colon">:</span>
          <span class="tens">00</span>
        </p>
        <button class="btnStart button"><span>start</span></button>
        <button class="btnStop button"><span>stop</span></button>
        <button class="btnReset button"><span>reset</span></button>
      </div>
    </div>
    
    <script src="app.js"></script>
  </body>
</html>
